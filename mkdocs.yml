site_name: MaaS Blueprint
site_description: 商业化多模态 MaaS 的参考蓝本：从 GPU 集群到可售卖的服务
site_url: https://dev.rho.social/maas-blueprint/
repo_url: https://github.com/rhosocial/maas-blueprint
repo_name: rhosocial/maas-blueprint
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 rhosocial · <a href="/maas-blueprint/privacy/">隐私说明</a> · 文档 CC BY 4.0 · 代码示例 Apache-2.0

theme:
  name: material
  language: zh
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

