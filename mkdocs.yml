plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  # Mermaid 由 Material 在运行时从 unpkg 加载；如需完全离线，可按主题文档本地化。
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/baidu-tongji.js

extra:
  generator: false
  analytics:
    provider: google
    property: G-VPM29QVEST
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rhosocial/maas-blueprint
      name: GitHub
